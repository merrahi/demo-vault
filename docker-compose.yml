services:
  # 1. Base de données MySQL avec Healthcheck
  db:
    image: mysql:8.0
    container_name: demo_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 2. Serveur Vault
  vault:
    image: hashicorp/vault:latest
    container_name: demo_vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "myroottoken"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # 3. Interface phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: demo_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      db:
        condition: service_healthy

  # 4. Application PHP
  web:
    build: ./app
    container_name: demo_web
    ports:
      - "8080:80"
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "myroottoken"
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_healthy